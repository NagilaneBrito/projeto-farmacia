<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Remédio</title>
    <link rel="stylesheet" href="read.css">
</head>
<body>
    <div class="navbar">
        <div class="logo" onclick="toggleSidebar()">
            <img class="logo" src="../../images/LogoEmpresa.png" alt="" />

        </div>
        <div class="nav-buttons">
            <button onclick="document.location='../../pagina-inicial/index.html'">Início</button>
            <button onclick="document.location='../pedidos.html'">Pedidos</button>
            <div class="notification">
                <span class="notification-icon">🔔</span>
                <span class="notification-count">3</span>
            </div>
        </div>
    </div>
    <div class="medicamento-detalhes-container">
        <!-- Imagem do remédio ao lado -->
        <div class="medicamento-imagem">
            <img src="../../images/analgesicos/Aspirina (ácido acetilsalicílico).jfif" alt="Imagem do Remédio">
        </div>
        
        <!-- Informações do remédio -->
        <div class="medicamento-info">
            <h3>Aspirina</h3>
            <p><strong>Dosagem:</strong></p>
            <div class="dosagem-botoes">
                <button>100 mg</button>
                <button>500 mg</button>
            </div>
            <div class="acao-botoes">
                <button class="editar">Fazer pedido</button>
                <button class="excluir">Excluir</button>
            </div>
        </div>
    </div>
</body>
</html>
