<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes dos Clientes</title>
    <link rel="stylesheet" href="lista.css">
</head>
<body>
    <div class="navbar">
        <div class="logo" onclick="toggleSidebar()">
            <img class="logo" src="../images/LogoEmpresa.png" alt="" />

        </div>
        <div class="nav-buttons">
            <button onclick="document.location='../crud_funcionario/pagina-inicial_funcionario/index.html'">Início</button>
            <button onclick="document.location='cadastro_cliente.html'">Cadastro de Cliente</button>
            <button onclick="document.location='lista_cliente.html'">Cliente</button>
            <button onclick="document.location='../crud_remedios/lista_remedio.html'">Estoques</button>
            <button>Relatórios</button>
            <div class="notification">
                <span class="notification-icon">🔔</span>
                <span class="notification-count">3</span>
            </div>
        </div>
    </div>

    <div class="lista-cliente">
        <!-- Produto 1 -->
        <div class="cliente-detalhes-container">
            <div class="cliente-imagem">
                <img src="https://via.placeholder.com/150?text=Cliente" alt="Imagem do Cliente 1">
            </div>
            <div class="cliente-info">
                <h3>Nome do Cliente 1</h3>
                <p><strong>Remédio:</strong> Controlados</p>
                <div class="cargo-botoes">
                </div>
                <div class="acao-botoes">
                    <button class="editar" onclick="document.location='update_cliente.html'">Editar</button>
                    <button class="excluir">Excluir</button>
                </div>
            </div>
        </div>

        <!-- Produto 2 -->
        <div class="cliente-detalhes-container">
            <div class="cliente-imagem">
                <img src="https://via.placeholder.com/150?text=Cliente" alt="Imagem do Cliente 2">
            </div>
            <div class="cliente-info">
                <h3>Nome do Clientes 2</h3>
                <p><strong>Remédio:</strong> Diabete</p>
                <div class="cargo-botoes">
                </div>
                <div class="acao-botoes">
                    <button class="editar" onclick="document.location='update_cliente.html'">Editar</button>
                    <button class="excluir">Excluir</button>
                </div>
            </div>
        </div>

        <!-- Produto 3 -->
        <div class="cliente-detalhes-container">
            <div class="cliente-imagem">
                <img src="https://via.placeholder.com/150?text=Cliente" alt="Imagem do Cliente 3">
            </div>
            <div class="cliente-info">
                <h3>Nome do Clientes 3</h3>
                <p><strong>Remédio:</strong> Pressão</p>
                <div class="cargo-botoes">
                </div>
                <div class="acao-botoes">
                    <button class="editar" onclick="document.location='update_cliente.html'">Editar</button>
                    <button class="excluir">Excluir</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
