<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra fixa superior -->
    <div class="navbar">
        <div class="logo" onclick="toggleSidebar()">
            <img class="logo" src="../images/LogoEmpresa.png" alt="" />

        </div>
        <div class="nav-buttons">
            <button onclick="document.location='../crud_funcionario/pagina-inicial_funcionario/index.html'">Início</button>
            <button onclick="document.location='cadastro_cliente.html'">Cadastro de Cliente</button>
            <button onclick="document.location='lista_cliente.html'">Cliente</button>
            <button onclick="document.location='../crud_remedios/lista_remedio.html'">Estoques</button>
            <button>Relatórios</button>
            <div class="notification">
                <span class="notification-icon">🔔</span>
                <span class="notification-count">3</span>
            </div>
        </div>
    </div>

    <!-- Barra lateral escondida -->
    <div class="sidebar" id="sidebar">
        <ul>
            <li><a href="#">Perfil</a></li>
            <li><a href="#">Configurações</a></li>
            <li><a href="#">Ajuda</a></li>
            <li><a href="#">Sair</a></li>
        </ul>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }
    </script>

    <div class="title-balloon">
        <h2>Cadastro de Cliente</h2>
    </div>

    <div class="form-container">
        <div class="form-content">
            <form action="#" method="post" enctype="multipart/form-data">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="text" id="data_nascimento" name="data_nascimento" required>

                <label for="identidade">Identidade:</label>
                <input type="text" id="identidade" name="identidade" required>

                <label for="nome_mae">Nome da Mãe:</label>
                <input type="text" id="nome_mae" name="nome_mae" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" required>

                <label for="email">E-mail:</label>
                <input type="text" id="email" name="email" required>

                <label for="receita">Receita:</label>
                <textarea id="receita" name="receita" cols="31" rows="5" required></textarea>
                

                <button type="submit" onclick="document.location='lista_cliente.hmtl'">Cadastrar</button>
            </form>

            <div class="image-upload">
                <div class="image-preview" id="imagePreview">
                    <span>Nenhuma imagem selecionada</span>
                </div>
                <label for="imagem" class="upload-button">Adicionar Imagem</label>
                <input type="file" id="imagem" name="imagem" accept="image/*" required hidden onchange="previewImage(event)">
            </div>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const previewContainer = document.getElementById('imagePreview');
            previewContainer.innerHTML = '';
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = 'Imagem selecionada';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '100%';
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            } else {
                previewContainer.innerHTML = '<span>Nenhuma imagem selecionada</span>';
            }
        }
    </script>
</body>
</html>
